[package]
name = "poketon"
version = "1.0.0"
description = "Poketon: debilidades, stats, evoluciones y equipos Pokémon"
authors = ["Sergio Carrascosa Medina"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
open = "5"          # abrir el navegador para el login con Google
getrandom = "0.3"   # código aleatorio de un solo uso para ese login

[profile.release]
strip = true
lto = true
opt-level = "s"
