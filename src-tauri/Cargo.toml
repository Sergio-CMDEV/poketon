[package]
name = "poketon"
version = "1.0.2"
description = "Poketon: debilidades, stats, evoluciones y equipos Pokémon"
authors = ["Sergio Carrascosa Medina"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"   # lo usa tauri::generate_context! para la configuración de los plugins
open = "5"          # abrir el navegador para el login con Google
getrandom = "0.3"   # código aleatorio de un solo uso para ese login

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"   # actualización automática desde GitHub Releases

[profile.release]
strip = true
lto = true
opt-level = "s"
