# Nginx sirve public/ (HTML, CSS, JS) y pasa los .php a PHP-FPM.
# config.php, src/ y db/ quedan fuera de public/ y no se pueden pedir desde el navegador.
server {
    listen 80;
    root /var/www/public;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml application/manifest+json;

    # Detrás de Nginx Proxy Manager (y de Cloudflare, si el dominio va con la nube naranja): la IP real del usuario,
    # no la del proxy (la usan los límites de login y del online). Se fía de las direcciones privadas (el proxy de casa)
    # y de las de Cloudflare; el contenedor no se publica a Internet directamente, solo a través del proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    # Cloudflare (https://www.cloudflare.com/ips/)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Cabeceras de seguridad (el HTTPS y HSTS los pone Nginx Proxy Manager).
    # Ojo: un add_header dentro de un location hace que ese location pierda estas; por eso no se usa abajo.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: solo scripts propios y los de Google (login); imágenes propias y de PokeAPI/PokéSprite (GitHub) y Showdown
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https://raw.githubusercontent.com https://play.pokemonshowdown.com; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; worker-src 'self'" always;

    # Android (app de la Play Store): enlace verificado entre la app y la web
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # El service worker no se guarda en caché: así la web se actualiza en cuanto se publica una versión nueva
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    # Fotos de perfil: siempre como archivos, nunca pasan por PHP (^~ hace que no se miren las reglas de abajo)
    location ^~ /fotos/ {
        try_files $uri =404;
        expires 30d;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
