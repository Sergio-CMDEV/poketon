# Web en la máquina de webs del Proxmox. La base de datos está en su propia máquina:
# config.php apunta a su IP local.
#   docker compose up -d --build     → http://IP-DE-ESTA-MAQUINA:8080
services:
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    volumes:
      - ./:/var/www:ro
      # Fotos de perfil: la única carpeta donde PHP escribe. Antes del primer arranque:
      #   mkdir -p public/fotos && chown 82:82 public/fotos     (82 = www-data en Alpine)
      - ./public/fotos:/var/www/public/fotos
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
