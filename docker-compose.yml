# Web en la máquina de webs del Proxmox. La base de datos está en su propia máquina:
# config.php apunta a su IP local.
#   docker compose up -d --build     → http://IP-DE-ESTA-MAQUINA:8080
services:
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    volumes:
      - ./:/var/www:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
